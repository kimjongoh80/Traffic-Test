name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: test + Windows packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Test
        run: go test ./...
      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@v0.3.3
      - name: Package
        run: ./scripts/package.sh windows ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: TrafficTest-windows
          path: dist/*.zip

  macos:
    name: test + macOS packages
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Test
        run: go test ./...
      - name: Package
        run: ./scripts/package.sh macos ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      - name: Smoke test the app
        run: |
          set -e
          rm -rf /tmp/tt && mkdir /tmp/tt
          unzip -q dist/*apple-silicon.zip -d /tmp/tt
          /tmp/tt/TrafficTest/ttest version
          /tmp/tt/TrafficTest/ttest server -p 5310 & SRV=$!
          sleep 1
          /tmp/tt/TrafficTest/ttest client -c 127.0.0.1 -p 5310 -t 2 -R
          kill $SRV
      - uses: actions/upload-artifact@v4
        with:
          name: TrafficTest-macos
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
